name: Format issue 49 branch

on:
  push:
    branches:
      - fix/issue-49-durable-purchase-retry

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: fix/issue-49-durable-purchase-retry
      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          flutter-version: '3.44.0'
          channel: stable
      - run: dart format lib/services/ad_service.dart lib/services/purchase_verification_retry_store.dart test/purchase_verification_retry_store_test.dart
      - shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/services/ad_service.dart lib/services/purchase_verification_retry_store.dart test/purchase_verification_retry_store_test.dart
          git commit -m 'style(#49): apply dart format'
          git push origin HEAD:fix/issue-49-durable-purchase-retry
