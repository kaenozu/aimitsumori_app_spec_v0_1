name: Repository Protection

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  applied-protection:
    name: Applied main protection
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Validate checked-in ruleset contract
        shell: pwsh
        run: ./tool/configure_github_repository.ps1 -ValidateConfigOnly

      - name: Validate GitHub applied protection
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: ./tool/configure_github_repository.ps1 -ValidateAppliedProtection
