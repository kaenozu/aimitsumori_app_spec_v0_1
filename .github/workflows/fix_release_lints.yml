name: Fix release lint config

on:
  push:
    branches:
      - release/v0.1.2
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-release-v0.1.2-lint-config
  cancel-in-progress: true

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: release/v0.1.2
          fetch-depth: 0

      - name: Remove blocking-I/O lint
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('analysis_options.yaml')
          content = path.read_text(encoding='utf-8')
          updated = content.replace('    avoid_slow_async_io: true\n', '')
          if updated == content:
              raise SystemExit('No lint configuration change was required.')
          path.write_text(updated, encoding='utf-8')
          PY

      - name: Commit lint configuration
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add analysis_options.yaml
          git commit -m 'fix: keep asynchronous file I/O lint-safe'
          git push origin HEAD:release/v0.1.2
