name: Fix AdService test constructor

on:
  push:
    branches:
      - agent/fix-full-source-review

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-full-source-review
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true
      - name: Restore generative testing constructor
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/services/ad_service.dart')
          text = path.read_text(encoding='utf-8')
          old = '''  @visibleForTesting
  factory AdService.testing({
    bool adFree = true,
    PurchaseVerifier verifier = const TestingPurchaseVerifier(),
  }) {
    final service = AdService._(verifier: verifier);
    service.adFree.value = adFree;
    service._initialized = true;
    return service;
  }
'''
          new = '''  @visibleForTesting
  AdService.testing({
    bool adFree = true,
    PurchaseVerifier verifier = const TestingPurchaseVerifier(),
  }) : _verifier = verifier {
    this.adFree.value = adFree;
    _initialized = true;
  }
'''
          if old not in text:
              raise SystemExit('Expected factory constructor block was not found')
          text = text.replace(old, new, 1)
          ignore = '// ignore_for_file: prefer_initializing_formals\n\n'
          if ignore not in text:
              text = ignore + text
          path.write_text(text, encoding='utf-8')
          PY
          dart format lib/services/ad_service.dart
      - name: Remove one-shot workflow
        run: git rm .github/workflows/fix_ad_service_constructor.yml
      - name: Commit fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix: restore subclassable AdService test constructor"
          git push origin HEAD:agent/fix-full-source-review
