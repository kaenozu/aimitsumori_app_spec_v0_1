name: Format release branch

on:
  push:
    branches:
      - release/v0.1.2
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: format-release-v0.1.2
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: release/v0.1.2
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Apply Dart formatting
        run: dart format lib test integration_test

      - name: Commit formatting changes
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          if git diff --quiet; then
            echo 'No formatting changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib test integration_test
          git commit -m 'style: apply dart format for v0.1.2'
          git push origin HEAD:release/v0.1.2
