name: Analyzer Diagnostics

on:
  push:
    branches:
      - agent/fix-full-source-review-20260723
  workflow_dispatch:

permissions:
  contents: write

env:
  FLUTTER_VERSION: '3.44.0'

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/fix-full-source-review-20260723

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Capture analyzer output
        shell: bash
        run: |
          mkdir -p .ci
          set +e
          flutter analyze --no-fatal-infos > .ci/analyze.txt 2>&1
          exit_code=$?
          printf '\nANALYZE_EXIT_CODE=%s\n' "$exit_code" >> .ci/analyze.txt
          cat .ci/analyze.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f .ci/analyze.txt
          git commit -m "chore: capture analyzer diagnostics"
          git push origin HEAD:agent/fix-full-source-review-20260723
