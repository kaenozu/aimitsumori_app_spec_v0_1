name: Apply PR11 UI review fixes

on:
  push:
    branches:
      - agent/fix-full-source-review

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: agent/fix-full-source-review
          fetch-depth: 0
      - name: Apply focused UI fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          comparison = Path('lib/screens/comparison_screen.dart')
          text = comparison.read_text(encoding='utf-8')
          restore_old = '''  Future<void> _restorePurchases() async {
            await _adService.restorePurchases();
            if (mounted) _showMessage('購入履歴の復元を開始しました。');
          }
          '''
          restore_new = '''  Future<void> _restorePurchases() async {
            try {
              await _adService.restorePurchases();
              if (mounted) _showMessage('購入履歴の復元を開始しました。');
            } catch (error, stackTrace) {
              debugPrint('Purchase restore failed: $error\\n$stackTrace');
              if (mounted) {
                _showMessage('購入履歴を復元できませんでした。通信状態を確認してください。');
              }
            }
          }
          '''
          if restore_old not in text:
              raise SystemExit('restorePurchases target not found')
          text = text.replace(restore_old, restore_new, 1)
          boundary_old = '''    if (renderObject is! RenderRepaintBoundary || renderObject.size.isEmpty) {
          '''
          boundary_new = '''    if (renderObject is! RenderRepaintBoundary ||
              !renderObject.hasSize ||
              renderObject.size.isEmpty) {
          '''
          if boundary_old not in text:
              raise SystemExit('RenderRepaintBoundary target not found')
          comparison.write_text(text.replace(boundary_old, boundary_new, 1), encoding='utf-8')

          home = Path('lib/screens/home_screen.dart')
          text = home.read_text(encoding='utf-8')
          pattern = re.compile(
              r'''    final controller = TextEditingController\(\);\n'''
              r'''    final name = await showDialog<String>\(.*?'''
              r'''    controller\.dispose\(\);\n''',
              re.DOTALL,
          )
          replacement = '''    final name = await showDialog<String>(
                context: context,
                builder: (_) => const _CreateProjectDialog(),
              );
          '''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f'create dialog target count={count}')

          marker = 'enum _HomeMenuAction { settings }\n'
          dialog = '''class _CreateProjectDialog extends StatefulWidget {
            const _CreateProjectDialog();

            @override
            State<_CreateProjectDialog> createState() => _CreateProjectDialogState();
          }

          class _CreateProjectDialogState extends State<_CreateProjectDialog> {
            final TextEditingController _controller = TextEditingController();

            @override
            void dispose() {
              _controller.dispose();
              super.dispose();
            }

            void _submit() {
              final value = _controller.text.trim();
              if (value.isNotEmpty && value.length <= 100) {
                Navigator.pop(context, value);
              }
            }

            @override
            Widget build(BuildContext context) {
              return AlertDialog(
                title: const Text('案件作成'),
                content: TextField(
                  key: const ValueKey('project-name-field'),
                  controller: _controller,
                  maxLength: 100,
                  decoration: const InputDecoration(
                    labelText: '案件名',
                    hintText: '例: 新築外構工事',
                  ),
                  autofocus: true,
                  textInputAction: TextInputAction.done,
                  onSubmitted: (_) => _submit(),
                ),
                actions: [
                  TextButton(
                    onPressed: () async {
                      await HapticService.lightImpact();
                      if (context.mounted) Navigator.pop(context);
                    },
                    child: const Text('キャンセル'),
                  ),
                  FilledButton(
                    onPressed: () async {
                      await HapticService.lightImpact();
                      if (context.mounted) _submit();
                    },
                    child: const Text('次へ'),
                  ),
                ],
              );
            }
          }

          '''
          if marker not in text:
              raise SystemExit('home insertion marker not found')
          home.write_text(text.replace(marker, dialog + marker, 1), encoding='utf-8')

          Path('.github/workflows/apply-pr11-ui-review-fixes.yml').unlink()
      - name: Commit fixes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/screens/comparison_screen.dart lib/screens/home_screen.dart .github/workflows/apply-pr11-ui-review-fixes.yml
          git commit -m "fix: address pending UI review findings"
          git push origin HEAD:agent/fix-full-source-review
