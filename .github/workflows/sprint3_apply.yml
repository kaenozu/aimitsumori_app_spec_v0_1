name: Sprint 3 Apply and Verify

on:
  push:
    branches:
      - feature/sprint-3
    paths:
      - .github/sprint3_apply.py
      - .github/workflows/sprint3_apply.yml
  pull_request:
    branches:
      - main
    paths:
      - .github/sprint3_apply.py
      - .github/workflows/sprint3_apply.yml

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: feature/sprint-3
          fetch-depth: 0

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Apply scoped Sprint 3 changes
        run: python3 .github/sprint3_apply.py

      - name: Format
        run: dart format lib test

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      - name: Commit verified implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test pubspec.lock
          if git diff --cached --quiet; then
            echo "No implementation changes to commit."
            exit 1
          fi
          git commit -m "feat: implement Sprint 3 accessibility and tests"
          git push origin HEAD:feature/sprint-3
