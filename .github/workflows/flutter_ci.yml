name: Flutter CI

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.0'

jobs:
  quality:
    name: Format, analyze, test, debug build
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test
      - name: Analyze
        run: flutter analyze --no-fatal-infos
      - name: Run tests
        run: flutter test
      - name: Build debug APK
        run: flutter build apk --debug --no-pub

  emulator-e2e:
    name: Android emulator E2E
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Run Sprint 5 E2E
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: flutter test -d emulator-5554 test/integration/sprint5_e2e_test.dart -r expanded

  release-smoke:
    name: Release APK smoke build
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ADMOB_APP_ID: ca-app-pub-1234567890123456~1234567890
      ADMOB_ANDROID_BANNER_ID: ca-app-pub-1234567890123456/1234567890
      ADMOB_ANDROID_REWARDED_ID: ca-app-pub-1234567890123456/0987654321
      REMOVE_ADS_PRODUCT_ID: remove_ads_ci
      PURCHASE_VERIFICATION_URL: https://example.invalid/api/store/verify
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve dependencies
        run: flutter pub get
      - name: Create ephemeral signing key
        run: |
          keytool -genkeypair \
            -storetype PKCS12 \
            -keystore android/app/ci-release.keystore \
            -storepass ciReleasePassword \
            -keypass ciReleasePassword \
            -alias ciRelease \
            -keyalg RSA \
            -keysize 2048 \
            -validity 2 \
            -dname 'CN=CI Release Validation, OU=CI, O=aimitsumori, L=Tokyo, ST=Tokyo, C=JP'
          cat > android/key.properties <<'EOF'
          storePassword=ciReleasePassword
          keyPassword=ciReleasePassword
          keyAlias=ciRelease
          storeFile=app/ci-release.keystore
          EOF
      - name: Build release APK
        run: |
          flutter build apk --release --no-pub \
            --dart-define=ADMOB_ANDROID_BANNER_ID="$ADMOB_ANDROID_BANNER_ID" \
            --dart-define=ADMOB_ANDROID_REWARDED_ID="$ADMOB_ANDROID_REWARDED_ID" \
            --dart-define=REMOVE_ADS_PRODUCT_ID="$REMOVE_ADS_PRODUCT_ID" \
            --dart-define=PURCHASE_VERIFICATION_URL="$PURCHASE_VERIFICATION_URL"
          test -f build/app/outputs/flutter-apk/app-release.apk
      - name: Remove ephemeral signing files
        if: always()
        run: rm -f android/key.properties android/app/ci-release.keystore
