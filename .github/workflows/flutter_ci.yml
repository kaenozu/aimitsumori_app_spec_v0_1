name: Flutter CI

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.0'

jobs:
  format-agent-pr:
    name: Format agent branch
    if: github.event_name == 'pull_request' && startsWith(github.head_ref, 'agent/')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Check out head branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Apply analyzer fixes
        run: |
          python3 - <<'PY'
          from pathlib import Path

          quote_input = Path('lib/screens/quote_input_screen.dart')
          text = quote_input.read_text(encoding='utf-8')
          old = 'FilePicker.platform.pickFiles('
          new = 'FilePicker.pickFiles('
          if old not in text:
              raise SystemExit('quote_input_screen.dart target not found')
          quote_input.write_text(text.replace(old, new, 1), encoding='utf-8')

          comparison = Path('lib/screens/comparison_screen.dart')
          text = comparison.read_text(encoding='utf-8')
          old = '''  Future<_CapturedComparison> _captureComparison() async {
    await WidgetsBinding.instance.endOfFrame;
    final renderObject = _captureKey.currentContext?.findRenderObject();
    if (renderObject is! RenderRepaintBoundary || renderObject.size.isEmpty) {
      throw StateError('比較画面のキャプチャ領域を取得できませんでした。');
    }
    final pixelRatio = MediaQuery.devicePixelRatioOf(
      context,
    ).clamp(1.0, 3.0).toDouble();
'''
          new = '''  Future<_CapturedComparison> _captureComparison() async {
    final pixelRatio = MediaQuery.devicePixelRatioOf(
      context,
    ).clamp(1.0, 3.0).toDouble();
    await WidgetsBinding.instance.endOfFrame;
    final renderObject = _captureKey.currentContext?.findRenderObject();
    if (renderObject is! RenderRepaintBoundary || renderObject.size.isEmpty) {
      throw StateError('比較画面のキャプチャ領域を取得できませんでした。');
    }
'''
          if old not in text:
              raise SystemExit('comparison_screen.dart target not found')
          comparison.write_text(text.replace(old, new, 1), encoding='utf-8')

          scanner = Path('lib/screens/document_scanner_screen.dart')
          text = scanner.read_text(encoding='utf-8')
          old_method = '''  void _reorder(int oldIndex, int newIndex) {
    setState(() {
      if (newIndex > oldIndex) newIndex--;
      final page = _pages.removeAt(oldIndex);
      _pages.insert(newIndex, page);
      _retakeIndex = null;
    });
  }
'''
          new_method = '''  void _reorder(int oldIndex, int newIndex) {
    setState(() {
      final page = _pages.removeAt(oldIndex);
      _pages.insert(newIndex, page);
      _retakeIndex = null;
    });
  }
'''
          if old_method not in text:
              raise SystemExit('document_scanner_screen.dart method target not found')
          text = text.replace(old_method, new_method, 1)
          old_callback = '                  onReorder: _reorder,'
          new_callback = '                  onReorderItem: _reorder,'
          if old_callback not in text:
              raise SystemExit('document_scanner_screen.dart callback target not found')
          scanner.write_text(text.replace(old_callback, new_callback, 1), encoding='utf-8')
          PY

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve and format
        run: |
          flutter pub get
          dart format lib test integration_test

      - name: Commit source fixes, formatting, and lockfile
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test integration_test pubspec.lock
          git commit -m "fix: resolve remaining Flutter analyzer issues"
          git push origin HEAD:${{ github.head_ref }}

  quality:
    name: Format, analyze, test, debug build
    needs: format-agent-pr
    if: always() && (needs.format-agent-pr.result == 'success' || needs.format-agent-pr.result == 'skipped')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      issues: write
      pull-requests: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test

      - name: Analyze
        id: analyze
        shell: bash
        run: |
          set +e
          mkdir -p .ci
          flutter analyze --no-fatal-infos > .ci/analyze.txt 2>&1
          exit_code=$?
          cat .ci/analyze.txt
          echo "exit_code=$exit_code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Post analyzer diagnostics
        if: steps.analyze.outputs.exit_code != '0' && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import pathlib
          import urllib.request

          log = pathlib.Path('.ci/analyze.txt').read_text(encoding='utf-8', errors='replace')
          body = '### Flutter analyzer diagnostics\n\n```text\n' + log[-60000:] + '\n```'
          url = f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/issues/{os.environ['PR_NUMBER']}/comments"
          request = urllib.request.Request(
              url,
              data=json.dumps({'body': body}).encode('utf-8'),
              headers={
                  'Authorization': f"Bearer {os.environ['GH_TOKEN']}",
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'Content-Type': 'application/json',
              },
              method='POST',
          )
          with urllib.request.urlopen(request) as response:
              print(response.status)
          PY

      - name: Enforce analyzer result
        if: steps.analyze.outputs.exit_code != '0'
        run: exit 1

      - name: Run unit and widget tests
        run: flutter test -r expanded

      - name: Build debug APK
        run: flutter build apk --debug --no-pub

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: aimitsumori-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  emulator-e2e:
    name: Android emulator E2E
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Sprint 5 E2E
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim
          script: flutter test -d emulator-5554 test/integration/sprint5_e2e_test.dart -r expanded

  release-apk:
    name: Release APK compile
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ADMOB_APP_ID: ca-app-pub-1234567890123456~1234567890
      ADMOB_ANDROID_BANNER_ID: ca-app-pub-1234567890123456/1234567890
      ADMOB_ANDROID_REWARDED_ID: ca-app-pub-1234567890123456/0987654321
      REMOVE_ADS_PRODUCT_ID: remove_ads_ci
      PURCHASE_VERIFICATION_URL: https://purchase-verification.invalid/verify
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Create ephemeral CI signing key
        run: |
          keytool -genkeypair \
            -storetype PKCS12 \
            -keystore android/app/ci-release.keystore \
            -storepass ciReleasePassword \
            -keypass ciReleasePassword \
            -alias ciRelease \
            -keyalg RSA \
            -keysize 2048 \
            -validity 2 \
            -dname 'CN=CI Release Validation, OU=CI, O=aimitsumori, L=Tokyo, ST=Tokyo, C=JP'
          cat > android/key.properties <<'EOF'
          storePassword=ciReleasePassword
          keyPassword=ciReleasePassword
          keyAlias=ciRelease
          storeFile=app/ci-release.keystore
          EOF

      - name: Build release APK
        run: |
          flutter build apk --release --no-pub \
            --dart-define=ADMOB_ANDROID_BANNER_ID="$ADMOB_ANDROID_BANNER_ID" \
            --dart-define=ADMOB_ANDROID_REWARDED_ID="$ADMOB_ANDROID_REWARDED_ID" \
            --dart-define=REMOVE_ADS_PRODUCT_ID="$REMOVE_ADS_PRODUCT_ID" \
            --dart-define=PURCHASE_VERIFICATION_URL="$PURCHASE_VERIFICATION_URL"
          test -f build/app/outputs/flutter-apk/app-release.apk

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: aimitsumori-release-validation-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

      - name: Remove ephemeral signing files
        if: always()
        run: rm -f android/key.properties android/app/ci-release.keystore
