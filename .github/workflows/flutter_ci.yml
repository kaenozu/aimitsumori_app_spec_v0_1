name: Flutter CI

on:
  push:
    branches:
      - main
      - feature/ocr-sqlite-admob
  pull_request:
    branches:
      - main

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Resolve dependencies
        run: flutter pub get
      - name: Analyze
        id: analyze
        shell: bash
        run: |
          set +e
          flutter analyze 2>&1 | tee analyze.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Test
        id: test
        shell: bash
        run: |
          set +e
          flutter test 2>&1 | tee test.log
          echo "exit_code=${PIPESTATUS[0]}" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-ci-logs
          path: |
            analyze.log
            test.log
      - name: Enforce checks
        shell: bash
        run: |
          if [[ "${{ steps.analyze.outputs.exit_code }}" != "0" || "${{ steps.test.outputs.exit_code }}" != "0" ]]; then
            exit 1
          fi
