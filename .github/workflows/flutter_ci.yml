name: Flutter CI

on:
  push:
    branches:
      - main
      - 'agent/**'
      - 'feature/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutter-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.0'

jobs:
  quality:
    name: Format, analyze, test, debug build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Test release manifest generator
        run: python3 tool/test_generate_android_release_manifest.py

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Show Flutter version
        run: flutter --version

      - name: Resolve dependencies
        run: flutter pub get

      - name: Validate repository ruleset configuration
        shell: pwsh
        run: ./tool/configure_github_repository.ps1 -ValidateOnly

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test

      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee analyze.log

      - name: Run unit and widget tests
        run: |
          set -o pipefail
          flutter test -r expanded 2>&1 | tee test.log

      - name: Build debug APK
        run: |
          set -o pipefail
          flutter build apk --debug --no-pub 2>&1 | tee android-debug-build.log

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-quality-logs
          path: |
            analyze.log
            test.log
            android-debug-build.log
          if-no-files-found: ignore

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: aimitsumori-debug-apk
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  emulator-e2e:
    name: Android emulator E2E
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 50
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run Sprint 5 E2E
        uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          profile: pixel_6
          disk-size: 4096M
          disable-animations: true
          # Override the default userdata size after AVD creation; ubuntu runners
          # may not have enough free space for the action's default partition.
          pre-emulator-launch-script: |
            set -euo pipefail
            # Free runner disk used by toolchains not needed for Flutter E2E.
            sudo rm -rf /usr/share/dotnet /opt/ghc
            sudo rm -rf "$ANDROID_HOME/ndk" "$ANDROID_HOME/cmake"
            config="$HOME/.android/avd/test.avd/config.ini"
            sed -i '/^disk.dataPartition.size=/d' "$config"
            printf '%s\n' 'disk.dataPartition.size=4294967296' >> "$config"
          script: flutter test -d emulator-5554 test/integration/sprint5_e2e_test.dart -r expanded

  release-apk:
    name: Release APK compile
    needs: quality
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      ADMOB_APP_ID: ca-app-pub-1234567890123456~1234567890
      ADMOB_ANDROID_BANNER_ID: ca-app-pub-1234567890123456/1234567890
      ADMOB_ANDROID_REWARDED_ID: ca-app-pub-1234567890123456/0987654321
      REMOVE_ADS_PRODUCT_ID: remove_ads_ci
      PURCHASE_VERIFICATION_URL: https://purchase-verification.invalid/verify
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Resolve dependencies
        run: flutter pub get

      - name: Create ephemeral CI signing key
        run: |
          keytool -genkeypair \
            -storetype PKCS12 \
            -keystore android/app/ci-release.keystore \
            -storepass ciReleasePassword \
            -keypass ciReleasePassword \
            -alias ciRelease \
            -keyalg RSA \
            -keysize 2048 \
            -validity 2 \
            -dname 'CN=CI Release Validation, OU=CI, O=aimitsumori, L=Tokyo, ST=Tokyo, C=JP'
          cat > android/key.properties <<'EOF'
          storePassword=ciReleasePassword
          keyPassword=ciReleasePassword
          keyAlias=ciRelease
          storeFile=app/ci-release.keystore
          EOF

      - name: Build release APK
        run: |
          flutter build apk --release --no-pub \
            --dart-define=ADMOB_ANDROID_BANNER_ID="$ADMOB_ANDROID_BANNER_ID" \
            --dart-define=ADMOB_ANDROID_REWARDED_ID="$ADMOB_ANDROID_REWARDED_ID" \
            --dart-define=REMOVE_ADS_PRODUCT_ID="$REMOVE_ADS_PRODUCT_ID" \
            --dart-define=PURCHASE_VERIFICATION_URL="$PURCHASE_VERIFICATION_URL"
          test -f build/app/outputs/flutter-apk/app-release.apk

      - name: Build release AAB
        run: |
          flutter build appbundle --release --no-pub \
            --dart-define=ADMOB_ANDROID_BANNER_ID="$ADMOB_ANDROID_BANNER_ID" \
            --dart-define=ADMOB_ANDROID_REWARDED_ID="$ADMOB_ANDROID_REWARDED_ID" \
            --dart-define=REMOVE_ADS_PRODUCT_ID="$REMOVE_ADS_PRODUCT_ID" \
            --dart-define=PURCHASE_VERIFICATION_URL="$PURCHASE_VERIFICATION_URL"
          test -f build/app/outputs/bundle/release/app-release.aab

      - name: Upload release validation artifacts
        uses: actions/upload-artifact@v4
        with:
          name: aimitsumori-release-validation-android
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Remove ephemeral signing files
        if: always()
        run: rm -f android/key.properties android/app/ci-release.keystore

  release-tag:
    name: Create release tag
    needs:
      - quality
      - emulator-e2e
      - release-apk
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out verified main commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Derive tag from pubspec
        id: version
        shell: bash
        run: |
          set -euo pipefail
          version="$(awk '/^version:[[:space:]]+/ { print $2; exit }' pubspec.yaml)"
          if [[ ! "$version" =~ ^([0-9]+\.[0-9]+\.[0-9]+)\+([0-9]+)$ ]]; then
            echo "::error::pubspec.yaml version must use x.y.z+build format: $version"
            exit 1
          fi

          release_version="${BASH_REMATCH[1]}"
          tag="v${release_version}"
          if ! grep -Fq "## [${release_version}]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md does not contain ## [${release_version}]"
            exit 1
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Create annotated tag
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --tags origin "refs/tags/${RELEASE_TAG}" >/dev/null 2>&1; then
            echo "${RELEASE_TAG} already exists; nothing to do."
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git tag -a "$RELEASE_TAG" "$GITHUB_SHA" -m "Release $RELEASE_TAG"
          git push origin "refs/tags/$RELEASE_TAG"
