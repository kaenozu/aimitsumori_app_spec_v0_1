name: Source Repair

on:
  push:
    branches:
      - 'agent/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: source-repair-${{ github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - name: Apply source repair
        run: python3 tool/apply_source_repair.py

      - name: Commit source repair
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/screens/quote_input_screen.dart \
            lib/screens/comparison_screen.dart \
            lib/screens/document_scanner_screen.dart
          git commit -m "fix: resolve remaining Flutter analyzer issues"
          git push origin HEAD:${{ github.ref_name }}
