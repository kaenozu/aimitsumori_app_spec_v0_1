name: Flutter CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  delete-merged-branch:
    name: Delete merged migration branch
    if: github.head_ref == 'agent/test-db-v1-v4-migration'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Delete merged branch
        run: >-
          gh api --method DELETE
          "repos/${GITHUB_REPOSITORY}/git/refs/heads/agent/test-db-v1-v4-migration"
