name: Flutter CI

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

permissions:
  contents: write

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.0'

jobs:
  format-agent-branch:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/agent/')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Resolve and format
        run: |
          flutter pub get
          dart format lib test integration_test
      - name: Commit generated formatting and lockfile
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib test integration_test pubspec.lock
          git commit -m "style: apply Dart formatting and resolve lockfile"
          git push origin HEAD:${{ github.ref_name }}

  analyze-test-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Resolve dependencies
        run: flutter pub get
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test
      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee analyze.log
      - name: Test
        run: |
          set -o pipefail
          flutter test 2>&1 | tee test.log
      - name: Build debug APK
        run: |
          set -o pipefail
          flutter build apk --debug 2>&1 | tee android-debug-build.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-ci-logs
          path: |
            analyze.log
            test.log
            android-debug-build.log
            pubspec.lock

  android-release-smoke:
    needs: analyze-test-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ADMOB_ANDROID_APP_ID: ca-app-pub-1111111111111111~2222222222
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Create ephemeral upload key
        run: |
          if [[ "${{ steps.analyze.outputs.exit_code }}" != "0" || "${{ steps.test.outputs.exit_code }}" != "0" ]]; then
            exit 1
          fi

  android-release:
    if: github.event_name == 'workflow_dispatch'
    needs: analyze-and-test
    runs-on: ubuntu-latest
    env:
      ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
      ADMOB_ANDROID_BANNER_ID: ${{ secrets.ADMOB_ANDROID_BANNER_ID }}
      ADMOB_ANDROID_REWARDED_ID: ${{ secrets.ADMOB_ANDROID_REWARDED_ID }}
      REMOVE_ADS_PRODUCT_ID: ${{ secrets.REMOVE_ADS_PRODUCT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Resolve dependencies
        run: flutter pub get
      - name: Configure release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$KEYSTORE_BASE64"
          echo "$KEYSTORE_BASE64" | base64 --decode > android/upload-keystore.jks
          cat > android/key.properties <<EOF
          storePassword=$KEYSTORE_PASSWORD
          keyPassword=$KEY_PASSWORD
          keyAlias=$KEY_ALIAS
          storeFile=../upload-keystore.jks
          EOF
      - name: Validate release configuration
        run: |
          [[ "$ADMOB_APP_ID" =~ ^ca-app-pub-[0-9]{16}~[0-9]{10}$ ]]
          [[ "$ADMOB_ANDROID_BANNER_ID" =~ ^ca-app-pub-[0-9]{16}/[0-9]{10}$ ]]
          [[ "$ADMOB_ANDROID_REWARDED_ID" =~ ^ca-app-pub-[0-9]{16}/[0-9]{10}$ ]]
          [[ "$REMOVE_ADS_PRODUCT_ID" =~ ^[A-Za-z0-9._-]{1,100}$ ]]
          test "$ADMOB_APP_ID" != "ca-app-pub-3940256099942544~3347511713"
          test "$ADMOB_ANDROID_BANNER_ID" != "ca-app-pub-3940256099942544/6300978111"
          test "$ADMOB_ANDROID_REWARDED_ID" != "ca-app-pub-3940256099942544/5224354917"
      - name: Build release AAB
        run: |
          flutter build appbundle --release --no-pub \
            --dart-define=ADMOB_APP_ID="$ADMOB_APP_ID" \
            --dart-define=ADMOB_ANDROID_BANNER_ID="$ADMOB_ANDROID_BANNER_ID" \
            --dart-define=ADMOB_ANDROID_REWARDED_ID="$ADMOB_ANDROID_REWARDED_ID" \
            --dart-define=REMOVE_ADS_PRODUCT_ID="$REMOVE_ADS_PRODUCT_ID"
      - name: Build release APK for artifact audit
        run: |
          flutter build apk --release --no-pub \
            --dart-define=ADMOB_APP_ID="$ADMOB_APP_ID" \
            --dart-define=ADMOB_ANDROID_BANNER_ID="$ADMOB_ANDROID_BANNER_ID" \
            --dart-define=ADMOB_ANDROID_REWARDED_ID="$ADMOB_ANDROID_REWARDED_ID" \
            --dart-define=REMOVE_ADS_PRODUCT_ID="$REMOVE_ADS_PRODUCT_ID"
      - name: Audit release APK
        shell: bash
        run: |
          set -euo pipefail
          sdk_root="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          build_tools="$(find "$sdk_root/build-tools" -mindepth 1 -maxdepth 1 -type d -printf '%f\n' | sort -V | tail -n 1)"
          aapt2="$sdk_root/build-tools/$build_tools/aapt2"
          apksigner="$sdk_root/build-tools/$build_tools/apksigner"
          apk="build/app/outputs/flutter-apk/app-release.apk"
          badging="$($aapt2 dump badging "$apk")"
          manifest="$($aapt2 dump xmltree --file AndroidManifest.xml "$apk")"
          grep -F "package: name='com.kaenozu.aimitsumori_app'" <<< "$badging"
          grep -Fq 'com.google.android.gms.ads.APPLICATION_ID' <<< "$manifest"
          grep -Fq "$ADMOB_APP_ID" <<< "$manifest"
          ! grep -Fq 'ca-app-pub-3940256099942544~3347511713' <<< "$manifest"
          ! grep -Fq 'ca-app-pub-3940256099942544/6300978111' <<< "$manifest"
          ! grep -Fq 'ca-app-pub-3940256099942544/5224354917' <<< "$manifest"
          "$apksigner" verify --verbose "$apk" 2>&1 | tee apk-signature.txt
          grep -Fq 'Verified using v2 scheme (APK Signature Scheme v2): true' apk-signature.txt
          grep -Fq 'Number of signers: 1' apk-signature.txt
      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: aimitsumori-release-aab
          path: build/app/outputs/bundle/release/app-release.aab
      - name: Upload audited release APK
        uses: actions/upload-artifact@v4
        with:
          name: aimitsumori-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Remove release signing files
        if: always()
        run: rm -f android/key.properties android/upload-keystore.jks
