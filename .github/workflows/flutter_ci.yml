name: Flutter CI

on:
  push:
    branches:
      - main
      - 'agent/**'
  pull_request:
    branches:
      - main

concurrency:
  group: flutter-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.0'

jobs:
  analyze-test-build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - name: Flutter version
        run: flutter --version
      - name: Resolve dependencies
        run: flutter pub get
      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test integration_test
      - name: Analyze
        run: |
          set -o pipefail
          flutter analyze 2>&1 | tee analyze.log
      - name: Test
        run: |
          set -o pipefail
          flutter test 2>&1 | tee test.log
      - name: Build debug APK
        run: |
          set -o pipefail
          flutter build apk --debug 2>&1 | tee android-debug-build.log
      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: flutter-ci-logs
          path: |
            analyze.log
            test.log
            android-debug-build.log
            pubspec.lock

  android-release-smoke:
    needs: analyze-test-build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ADMOB_ANDROID_APP_ID: ca-app-pub-1111111111111111~2222222222
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Create ephemeral upload key
        run: |
          keytool -genkeypair -noprompt \
            -keystore /tmp/ci-upload.jks \
            -storepass android \
            -keypass android \
            -alias upload \
            -dname "CN=CI, OU=CI, O=CI, L=Tokyo, ST=Tokyo, C=JP" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1
          cat > android/key.properties <<'EOF'
          storePassword=android
          keyPassword=android
          keyAlias=upload
          storeFile=/tmp/ci-upload.jks
          EOF
      - name: Build signed release AAB
        run: |
          set -o pipefail
          flutter build appbundle --release \
            --dart-define=ADMOB_ANDROID_BANNER_ID=ca-app-pub-1111111111111111/3333333333 \
            --dart-define=ADMOB_ANDROID_REWARDED_ID=ca-app-pub-1111111111111111/4444444444 \
            --dart-define=PURCHASE_VERIFICATION_URL=https://example.invalid/verify \
            2>&1 | tee android-release-build.log
      - name: Upload release diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-release-build-log
          path: android-release-build.log

  android-integration:
    needs: analyze-test-build
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Run Android integration tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: flutter test integration_test

  ios-build-smoke:
    needs: analyze-test-build
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Create ephemeral iOS release config
        run: echo 'ADMOB_APP_ID=ca-app-pub-1111111111111111~2222222222' > ios/Flutter/ReleaseSecrets.xcconfig
      - name: Build iOS without signing
        run: |
          set -o pipefail
          flutter build ios --release --no-codesign \
            --dart-define=ADMOB_IOS_BANNER_ID=ca-app-pub-1111111111111111/3333333333 \
            --dart-define=ADMOB_IOS_REWARDED_ID=ca-app-pub-1111111111111111/4444444444 \
            --dart-define=PURCHASE_VERIFICATION_URL=https://example.invalid/verify \
            2>&1 | tee ios-release-build.log
      - name: Upload iOS diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-release-build-log
          path: ios-release-build.log
