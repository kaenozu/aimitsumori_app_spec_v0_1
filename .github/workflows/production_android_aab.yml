name: Production Android AAB

on:
  workflow_dispatch:
    inputs:
      release_ref:
        description: 'Annotated release tag to build (for example: v0.1.3)'
        required: true
        type: string
      upload_internal:
        description: 'Upload the signed AAB to the Google Play internal track'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: production-android-aab-${{ inputs.release_ref }}
  cancel-in-progress: false

env:
  FLUTTER_VERSION: '3.44.0'

jobs:
  build-production-aab:
    name: Build production-signed AAB
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 60
    env:
      RELEASE_REF: ${{ inputs.release_ref }}
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ADMOB_APP_ID: ${{ secrets.ADMOB_APP_ID }}
      ADMOB_ANDROID_BANNER_ID: ${{ secrets.ADMOB_ANDROID_BANNER_ID }}
      ADMOB_ANDROID_REWARDED_ID: ${{ secrets.ADMOB_ANDROID_REWARDED_ID }}
      REMOVE_ADS_PRODUCT_ID: ${{ secrets.REMOVE_ADS_PRODUCT_ID }}
      PURCHASE_VERIFICATION_URL: ${{ secrets.PURCHASE_VERIFICATION_URL }}
    steps:
      - name: Verify workflow runs from main
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$GITHUB_REF" != 'refs/heads/main' ]]; then
            echo '::error::Run this workflow from the main branch.'
            exit 1
          fi

      - name: Check out release source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ inputs.release_ref }}
          fetch-depth: 0
          path: release-source

      - name: Check out release tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          path: release-tools

      - name: Resolve release source
        id: release-source
        working-directory: release-source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          tag_ref="refs/tags/$RELEASE_REF"
          if ! git show-ref --verify --quiet "$tag_ref"; then
            echo "::error::Release tag does not exist: $RELEASE_REF"
            exit 1
          fi
          if [[ "$(git cat-file -t "$tag_ref")" != 'tag' ]]; then
            echo "::error::Release ref must be an annotated tag: $RELEASE_REF"
            exit 1
          fi

          source_sha="$(git rev-parse HEAD)"
          tag_sha="$(git rev-parse "$RELEASE_REF^{commit}")"
          if [[ "$source_sha" != "$tag_sha" ]]; then
            echo '::error::Checked-out source does not match the release tag commit.'
            exit 1
          fi

          echo "ref=$RELEASE_REF" >> "$GITHUB_OUTPUT"
          echo "sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "Building $RELEASE_REF at $source_sha"

      - name: Set up Java
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@748248ddd2a2 # v4.4.4

      - name: Set up Flutter
        uses: subosito/flutter-action@f2c4f6686ca8e8d6e6d0f28410eeef506ed66aff # v2.18.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Set up Ruby and fastlane
        if: ${{ inputs.upload_internal }}
        uses: ruby/setup-ruby@cb0fda56a307b8c78d38320cd40d9eb22a3bf04e # v1.242.0
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: release-tools

      - name: Validate production secrets
        shell: bash
        run: |
          set -euo pipefail
          required=(
            ANDROID_KEYSTORE_BASE64
            ANDROID_KEYSTORE_PASSWORD
            ANDROID_KEY_PASSWORD
            ANDROID_KEY_ALIAS
            ADMOB_APP_ID
            ADMOB_ANDROID_BANNER_ID
            ADMOB_ANDROID_REWARDED_ID
            REMOVE_ADS_PRODUCT_ID
            PURCHASE_VERIFICATION_URL
          )
          missing=()
          for name in "${required[@]}"; do
            if [[ -z "${!name:-}" ]]; then
              missing+=("$name")
            fi
          done
          if (( ${#missing[@]} > 0 )); then
            printf 'Missing required repository secrets:\n' >&2
            printf '  - %s\n' "${missing[@]}" >&2
            exit 1
          fi

      - name: Configure production signing
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode \
            > release-source/android/app/upload-keystore.jks
          cat > release-source/android/key.properties <<EOF_SIGNING
          storePassword=$ANDROID_KEYSTORE_PASSWORD
          keyPassword=$ANDROID_KEY_PASSWORD
          keyAlias=$ANDROID_KEY_ALIAS
          storeFile=app/upload-keystore.jks
          EOF_SIGNING

      - name: Resolve dependencies
        working-directory: release-source
        run: flutter pub get

      - name: Build production AAB
        working-directory: release-source
        shell: pwsh
        run: ./tool/build_android_release.ps1 -Artifact appbundle

      - name: Verify signed AAB
        shell: bash
        run: |
          set -uo pipefail
          source_aab='release-source/build/app/outputs/bundle/release/app-release.aab'
          test -s "$source_aab"
          cp "$source_aab" app-release.aab
          if apksigner verify --verbose app-release.aab 2>/dev/null; then
            echo 'AAB signature verified with apksigner'
          else
            echo 'apksigner not available; falling back to jarsigner'
            jarsigner -verify -strict app-release.aab || {
              rc=$?
              if jarsigner -verify app-release.aab 2>&1 | grep -q 'jar verified'; then
                echo 'JAR signature scheme verified (exit code $rc is benign for AAB v2/v3 signing)'
              else
                exit $rc
              fi
            }
          fi
          sha256sum app-release.aab | tee app-release.aab.sha256

      - name: Read signing certificate fingerprint
        id: signing-certificate
        shell: bash
        run: |
          set -euo pipefail
          fingerprint="$(
            keytool -exportcert -rfc \
              -keystore release-source/android/app/upload-keystore.jks \
              -alias "$ANDROID_KEY_ALIAS" \
              -storepass "$ANDROID_KEYSTORE_PASSWORD" \
              | openssl x509 -noout -fingerprint -sha256 \
              | cut -d= -f2
          )"
          if [[ ! "$fingerprint" =~ ^([0-9A-Fa-f]{2}:){31}[0-9A-Fa-f]{2}$ ]]; then
            echo '::error::Failed to derive the signing certificate SHA-256 fingerprint.'
            exit 1
          fi
          echo "fingerprint=$fingerprint" >> "$GITHUB_OUTPUT"

      - name: Generate release manifest
        shell: bash
        run: |
          set -euo pipefail
          python3 release-tools/tool/generate_android_release_manifest.py \
            --aab app-release.aab \
            --pubspec release-source/pubspec.yaml \
            --gradle release-source/android/app/build.gradle.kts \
            --output release-manifest.json \
            --repository "$GITHUB_REPOSITORY" \
            --ref '${{ steps.release-source.outputs.ref }}' \
            --commit-sha '${{ steps.release-source.outputs.sha }}' \
            --signer-certificate-sha256 '${{ steps.signing-certificate.outputs.fingerprint }}' \
            --require-version-tag
          cat release-manifest.json

          checksum_file_sha="$(cut -d' ' -f1 app-release.aab.sha256)"
          manifest_sha="$(python3 -c 'import json; print(json.load(open("release-manifest.json", encoding="utf-8"))["aab"]["sha256"])')"
          if [[ "$manifest_sha" != "$checksum_file_sha" ]]; then
            echo '::error::release-manifest.json AAB SHA-256 does not match app-release.aab.sha256.'
            exit 1
          fi

      - name: Upload production AAB
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aimitsumori-production-aab-${{ steps.release-source.outputs.sha }}
          path: |
            app-release.aab
            app-release.aab.sha256
            release-manifest.json
          if-no-files-found: error
          retention-days: 14

      - name: Configure Play Console credentials
        if: ${{ inputs.upload_internal }}
        shell: bash
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          set -euo pipefail
          if [[ -z "${PLAY_SERVICE_ACCOUNT_JSON:-}" ]]; then
            echo '::error::PLAY_SERVICE_ACCOUNT_JSON is required when upload_internal is enabled.'
            exit 1
          fi

          json_path="$RUNNER_TEMP/play-service-account.json"
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$json_path"
          python3 - "$json_path" <<'PY_JSON'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as credential_file:
              credentials = json.load(credential_file)

          required = {"client_email", "private_key", "token_uri"}
          missing = sorted(required.difference(credentials))
          if missing:
              raise SystemExit(
                  "Service-account JSON is missing required keys: "
                  + ", ".join(missing)
              )
          PY_JSON
          chmod 600 "$json_path"
          echo "PLAY_SERVICE_ACCOUNT_JSON_PATH=$json_path" >> "$GITHUB_ENV"
          echo "AAB_PATH=$GITHUB_WORKSPACE/app-release.aab" >> "$GITHUB_ENV"

      - name: Upload AAB to Play Console internal track
        if: ${{ inputs.upload_internal }}
        working-directory: release-tools
        run: bundle exec fastlane android internal

      - name: Remove signing and Play Console material
        if: always()
        shell: bash
        run: >-
          rm -f release-source/android/key.properties
          release-source/android/app/upload-keystore.jks
          "$RUNNER_TEMP/play-service-account.json"
